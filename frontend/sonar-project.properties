sonar.projectKey=LibreHousehold_Frontend
sonar.organization=nicklas2751-github

# Path is relative to the sonar-project.properties file.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts,src/**/*.test.ts

# Exclude generated sources and keep test files out of the source set (they are listed via sonar.tests)
sonar.exclusions=src/generated-sources/**,src/lib/paraglide/**,node_modules/**,src/**/*.spec.ts,src/**/*.test.ts

# Produced by "npm run test:coverage" (see coverage settings in vite.config.ts)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code
sonar.sourceEncoding=UTF-8
