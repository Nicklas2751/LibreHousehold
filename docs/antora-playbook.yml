site:
  # Not "Architecture Documentation": the title will appear on every page of the future project website
  title: LibreHousehold
  url: https://librehousehold.wiegandt.eu
  # Temporary until a ROOT component provides the landing page at /
  start_page: architecture::overview.adoc
content:
  sources:
    - url: ./..
      branches: HEAD
      start_paths:
        - docs/architecture
      edit_url: https://github.com/Nicklas2751/LibreHousehold/edit/main/{path}
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui
antora:
  extensions:
    - '@antora/lunr-extension'
asciidoc:
  attributes:
    # Store the diagrams in the site so readers do not depend on the Kroki server
    kroki-fetch-diagram: true
    # Overridden in CI with a local Kroki container to avoid depending on kroki.io availability
    kroki-server-url: https://kroki.io
  extensions:
    - asciidoctor-kroki
urls:
  redirect_facility: static
output:
  dir: ../build/site
