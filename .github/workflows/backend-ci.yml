name: Backend CI

# Called by ci.yml, which decides whether the backend changed.
on:
  workflow_call:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests and generate coverage report
        run: ./mvnw verify

      # The Sonar job scans these instead of running the whole test suite a second time.
      - name: Upload Sonar inputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-sonar-inputs
          path: |
            backend/target/classes
            backend/target/site/jacoco/jacoco.xml
          retention-days: 1

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download Sonar inputs
        uses: actions/download-artifact@v8.0.2
        with:
          name: backend-sonar-inputs
          path: backend/target

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        with:
          projectBaseDir: backend
          # Without waiting, the scan only uploads the analysis and the job stays green on a failed quality gate
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
