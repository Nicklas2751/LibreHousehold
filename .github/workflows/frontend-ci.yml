name: Frontend CI

# Called by ci.yml, which decides whether the frontend changed.
on:
  workflow_call:

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Needed for the openapi generation
      - uses: actions/setup-java@v5.3.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI sources
        run: npm run openapi

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI sources
        run: npm run openapi

      - name: Generate Paraglide sources
        run: npm run paraglide

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        with:
          projectBaseDir: frontend
          # Without waiting, the scan only uploads the analysis and the job stays green on a failed quality gate
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
