name: Docs CI

# Called by ci.yml, which decides whether the documentation changed. Builds the Antora site without
# deploying it, so broken xrefs, includes and diagrams fail the pull request instead of the deployment.
on:
  workflow_call:

defaults:
  run:
    working-directory: docs

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      # Renders the PlantUML diagrams, so the build does not depend on kroki.io availability and rate limits
      kroki:
        image: yuzutech/kroki:0.34.0
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:strict -- --attribute kroki-server-url=http://localhost:8000
