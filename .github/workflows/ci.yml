name: CI

# Runs for every pull request without path filters, so the required "CI result" check always
# appears. Path filters on the workflow level would leave a required check pending forever on pull
# requests that touch no matching path (e.g. GitHub Actions bumps), blocking the merge.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed_files"
          matches() {
            if grep -qE "$1" <<< "$changed_files"; then echo true; else echo false; fi
          }
          # A change to a CI workflow runs that workflow, so a broken workflow or action bump fails here
          echo "backend=$(matches '^(backend/|api/openapi\.yml$|\.github/workflows/(ci|backend-ci)\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(matches '^(frontend/|api/openapi\.yml$|\.github/workflows/(ci|frontend-ci)\.yml$)')" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit

  frontend:
    name: Frontend
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  # The only check required by the main branch ruleset. Every job that must pass before a merge has
  # to be listed in "needs"; skipped jobs count as passed, failed or cancelled ones block the merge.
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if grep -qE 'failure|cancelled' <<< "$RESULTS"; then
            exit 1
          fi
