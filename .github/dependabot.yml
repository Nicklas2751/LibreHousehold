version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # maven dependencies and plugins
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "maven"
    open-pull-requests-limit: 10

  # frontend dependencies and plugins
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10
    # These packages pin each other as peers, so a single-package bump fails to install.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "vitest-*"
          - "@vitest/*"
      sveltekit:
        patterns:
          - "@sveltejs/*"

  # documentation site generator (Antora) and its extensions
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10
    # The Antora packages pin each other, so a single-package bump fails to install.
    groups:
      antora:
        patterns:
          - "antora"
          - "@antora/*"
