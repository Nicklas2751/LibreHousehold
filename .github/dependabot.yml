version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # maven dependencies and plugins
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "maven"
    open-pull-requests-limit: 10

  # frontend dependencies and plugins
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10
    # These packages pin each other as peers, so a single-package bump fails to install.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "vitest-*"
          - "@vitest/*"
      sveltekit:
        patterns:
          - "@sveltejs/*"
    ignore:
      # TypeScript 7.0 has no stable programmatic API yet, so svelte-check (peer: ^5 || ^6)
      # cannot use it and npm ci fails with ERESOLVE. Microsoft calls this a point-in-time issue.
      # Remove this once svelte-check supports TypeScript 7.
      - dependency-name: "typescript"
        versions: ["7.0.x"]

  # AsyncAPI CLI validating the realtime event contract
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5

  # documentation site generator (Antora) and its extensions
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10
    # The Antora packages pin each other, so a single-package bump fails to install.
    groups:
      antora:
        patterns:
          - "antora"
          - "@antora/*"
    ignore:
      # asciidoctor-kroki 1.x and later require @asciidoctor/core 4, Antora 3.2 still ships core 2.2.
      # npm installs both side by side without an error, but the build fails at runtime
      # ("parent.applySubs is not a function"). Remove this once Antora ships @asciidoctor/core 4.
      - dependency-name: "asciidoctor-kroki"
        versions: [">=1.0.0"]
