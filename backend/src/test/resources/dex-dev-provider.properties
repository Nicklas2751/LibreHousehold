# Static part of the Dex social-login registration (see DexTestcontainersConfiguration). Must be in
# the environment before Spring Boot evaluates whether any client registration is configured, which
# happens before DynamicPropertyRegistrar values exist; only the issuer-uri is dynamic.
spring.security.oauth2.client.registration.dev-provider.client-id=librehousehold-dev
spring.security.oauth2.client.registration.dev-provider.client-secret=librehousehold-dev-secret
spring.security.oauth2.client.registration.dev-provider.client-name=Dex (local dev)
spring.security.oauth2.client.registration.dev-provider.scope=openid,profile,email
