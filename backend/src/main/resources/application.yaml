spring:
  application:
    name: librehousehold
  modulith:
    runtime:
      flyway-enabled: true
    events:
      # Only @ApplicationModuleListener methods get an entry in event_publication. Without this,
      # Spring Modulith records one for every AFTER_COMMIT @TransactionalEventListener, including the
      # synchronous realtime listeners: their change signals need no redelivery, since every client
      # resyncs on reconnect, and replaying one after a restart reaches no client (ADR-019).
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      # Publications stuck in a non-final state (e.g. after a crash mid-delivery) are marked FAILED
      # after this time, so EventPublicationMaintenanceJob can resubmit them; it only picks up FAILED
      # ones. Spring Modulith measures all three against the original publication date. 15 minutes
      # matches librehousehold.events.resubmit-min-age and lies far above the seconds a delivery
      # normally takes, so a delivery that is still running is not mistaken for a stuck one.
      staleness:
        published: 15m
        processing: 15m
        resubmitted: 15m
  mail:
    # Empty by default (same rationale as security.cors.allowed-origins below), not omitted: Spring
    # Boot's mail autoconfiguration only creates the JavaMailSender bean at all when this property is
    # present, and EmailSenderService (see the notifications module) depends on that bean unconditionally.
    # Self-hosters must set this (and port/username/password) explicitly, e.g. via SPRING_MAIL_HOST/
    # SPRING_MAIL_PORT/SPRING_MAIL_USERNAME/SPRING_MAIL_PASSWORD or an untracked application.yaml —
    # until then, sending an actual email fails at send time rather than at startup.
    host: ""
  web:
    error:
      # Defense-in-depth against leaking stacktraces to clients (OWASP A05): this already matches
      # Spring Boot's own default, but is set explicitly so it can never regress via an environment-
      # or tooling-specific default. Note the prefix: in Boot 4 this is bound via WebProperties
      # ("spring.web.error.*", see ErrorMvcAutoConfiguration), NOT the legacy "server.error.*" this
      # was previously (incorrectly) set under — that key is silently ignored by Boot 4 and never
      # bound to anything, which is exactly why this setting failed to prevent a real leak:
      # spring-boot-devtools ships its own "spring.web.error.include-stacktrace=always" default
      # (see spring-devtools.properties) as the lowest-priority PropertySource, and with no
      # higher-priority source ever actually setting the *correct* key, that devtools default won
      # in local dev (see the ValidationExceptionHandler / ErrorResponseExceptionHandler class
      # comments for the actual fix: those two custom exception families never even reach this
      # fallback page anymore).
      include-stacktrace: never

server:
  # Nginx terminates TLS and forwards internally over plain HTTP (see Kapitel 7). Without this,
  # Spring ignores X-Forwarded-Proto and treats every request as insecure, so CookieCsrfTokenRepository
  # would omit the Secure flag on XSRF-TOKEN (the session cookie is unaffected, its Secure flag is set
  # statically below). "framework" uses Spring's own ForwardedHeaderFilter instead of a Tomcat-specific
  # mechanism (e.g. RemoteIpValve's "native" strategy) and needs no trusted-proxy IP allowlist: the
  # backend is only reachable from Nginx on the internal Docker network, never directly from clients.
  forward-headers-strategy: framework
  tomcat:
    max-http-post-size: -1
  servlet:
    session:
      # Set explicitly instead of relying on Tomcat's default of the same value: the event stream and
      # the client align with it (ADR-019). librehousehold.realtime.emitter-timeout must stay below it
      # (checked at startup), and GET /me hands it to the client as sessionTimeoutSeconds, so the
      # client can close its stream before an idle session times out. Tomcat only applies whole minutes.
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        # Lax, not Strict (see ADR-014): a social login returns from the provider with a cross-site
        # top-level GET (/login/oauth2/code/{registrationId}), which must carry the session cookie
        # that holds the authorization request; Strict would not send it.
        same-site: lax

librehousehold:
  security:
    cors:
      # Comma-separated allow-list of origins permitted to send credentialed cross-origin requests
      # (see CORS1 in Arc42 Chapter 8). Empty by default (locked down): the target deployment serves
      # frontend and backend from the same origin via an Nginx reverse proxy. Self-hosters serving
      # them from different origins must set this explicitly, e.g.
      # LIBREHOUSEHOLD_SECURITY_CORS_ALLOWED_ORIGINS=https://household.example.com.
      allowed-origins: ""
    local-login:
      # On by default: login, setup and invite join with e-mail and password. Self-hosters offering
      # only social login can set this to false. GET /auth/discover then tells the client to hide
      # the local forms, and the form login (POST /v1/login) is rejected server-side.
      enabled: true
      # Social login (see ADR-016) is off unless providers are configured with Spring Boot's
      # standard OAuth2 client properties. The startup fails for a registration that lacks the
      # scopes social login needs (see SocialLoginRegistrationCheck and Arc42 Chapter 7). Example:
      # spring:
      #   security:
      #     oauth2:
      #       client:
      #         registration:
      #           google:
      #             client-id: ${GOOGLE_CLIENT_ID}
      #             client-secret: ${GOOGLE_CLIENT_SECRET}
      #             client-name: "Google"
      #             # Absolute in production; must match the URI registered at the provider
      #             redirect-uri: https://household.example.com/login/oauth2/code/google
      #           github:
      #             client-id: ${GITHUB_CLIENT_ID}
      #             client-secret: ${GITHUB_CLIENT_SECRET}
      #             client-name: "GitHub"
      #             redirect-uri: https://household.example.com/login/oauth2/code/github
      #             # GitHub's default (read:user) lacks the verified e-mail address
      #             scope: read:user,user:email
      #           keycloak:
      #             client-id: ${KEYCLOAK_CLIENT_ID}
      #             client-secret: ${KEYCLOAK_CLIENT_SECRET}
      #             redirect-uri: https://household.example.com/login/oauth2/code/keycloak
      #             # Issuer discovery sets no scopes
      #             scope: openid,profile,email
      #         provider:
      #           keycloak:
      #             issuer-uri: https://keycloak.example.com/realms/household
    email-verification:
      # How long a freshly issued email verification token stays valid (see VERIFY1 in Arc42
      # Chapter 8, and the account_token migration). 24h balances giving users enough time to check
      # their inbox against not leaving a long-lived, single-use credential around; a resend
      # (see /verification/resend) issues a fresh token with a new deadline at any time.
      token-validity: 24h
      # Grace period after registration before an account that never verified its email is deleted
      # (see UnverifiedAccountExpiryJob). A full week gives users generous time to find/confirm the
      # verification email even across a busy week, while still bounding how long unverified,
      # unusable accounts accumulate.
      grace-period-days: 7
      # How long before grace-period-days expiry the deletion warning email is sent, so the user has
      # a final chance to verify before the account/household is actually deleted.
      deletion-warning-hours-before: 24
    password-reset:
      # How long a freshly issued password reset token stays valid (see RESET1 in Arc42 Chapter 8).
      # Shorter than email-verification's 24h on purpose: a password reset link is a more sensitive,
      # higher-privilege credential than an email verification link, so it should not remain usable
      # for long. Requesting a new one at any time issues a fresh token with a new deadline.
      token-validity: 1h
    rate-limit:
      # RATE1 (see Arc42 Chapter 8): throttles POST /v1/login per e-mail+IP combination, on top of
      # the account-wide lockout below. 5 attempts per minute is generous enough for a genuine user
      # who mistypes their password a couple of times, while still meaningfully slowing down
      # credential-stuffing/brute-force attempts against a single account.
      login:
        max-attempts: 5
        window-duration: 1m
      # Throttles POST /v1/login per IP across all e-mail addresses, so cycling through many addresses
      # (credential stuffing, lockout of many accounts) is slowed down too. Higher than the per-
      # address limit, since several household members may share one IP (NAT).
      login-per-ip:
        max-attempts: 20
        window-duration: 1m
      # Shared by the password-reset and email-verification endpoints (POST /password-reset/request,
      # /password-reset/confirm, /members/verification/confirm, and the per-member
      # /verification/resend), keyed by IP only: several of these endpoints are unauthenticated and
      # have no meaningful "username" to key on, and an attacker trying many different email
      # addresses must still be throttled.
      sensitive-endpoints:
        max-attempts: 5
        window-duration: 1m
    lockout:
      # Account-wide lockout after repeated failed login attempts (AuthenticationFailureBadCredentialsEvent,
      # see AccountLockoutListener), independent of how slowly the attempts were made - complements
      # the rate-limit above, which only throttles the *rate*. Higher than rate-limit.login.max-attempts
      # on purpose: a legitimate user who is simply slow (e.g. across several rate-limit windows)
      # should not get their account locked as easily as they get rate-limited.
      max-attempts: 10
      lockout-duration: 15m

  frontend:
    # Base URL used to build links that are sent in emails (e.g. the email verification link) and
    # therefore must be absolute, since they are followed outside of any authenticated browser
    # session. Defaults to the same-origin deployment target described in the CORS comment above;
    # self-hosters serving the frontend from a different origin must override this, e.g.
    # LIBREHOUSEHOLD_FRONTEND_BASE_URL=https://household.example.com.
    base-url: "http://localhost:8080"

  events:
    # How often EventPublicationMaintenanceJob retries failed event publications and removes old
    # completed ones (see "Event delivery and resubmission" in Arc42 Chapter 8). 15 minutes gives a
    # temporarily unreachable mail server time to recover without delaying e-mails for hours.
    run-interval: 15m
    # Only publications at least this old (by publication date) are resubmitted, so a delivery that
    # just failed is not retried right away while its cause most likely still persists.
    resubmit-min-age: 15m
    # Total delivery attempts per publication, the first delivery included. Caps retries of
    # publications that can never succeed (e.g. for a member deleted in the meantime): with the
    # 15-minute interval, a publication gets about an hour of retries before it stays FAILED for
    # manual inspection.
    max-attempts: 5
    # Completed publications are kept this long for diagnosis (which event reached which listener,
    # and when), then deleted so event_publication does not grow without bound.
    completed-retention: 30d

  realtime:
    # Sent as the SSE "retry:" field (ADR-019, api/asyncapi.yml): how long EventSource waits before
    # it reconnects after the stream ended. 5 seconds lets a restarting server come back without a
    # burst of reconnects, while a member still sees changes again shortly after a dropped connection.
    reconnect-delay: 5s
    # How long a single stream stays open before the server ends it and EventSource reconnects.
    # Below the 30-minute session timeout on purpose: a stream must never outlive its session, and
    # every reconnect runs the full authentication and membership check again.
    emitter-timeout: 25m
    # How often every open stream gets an SSE comment (": heartbeat") and its session is checked
    # against the SessionRegistry (RT3). Below the 60-second default proxy_read_timeout of Nginx, so
    # the proxy never closes an idle stream; also the longest time a stream outlives a session ended
    # by expireNow() (e.g. password reset), which no event reports.
    heartbeat-interval: 25s
    # Limits for streams open at the same time (RT5): every stream holds a connection and a slot in
    # the registry, so without them a single session could exhaust the server. A stream beyond a
    # limit is rejected with 429 and Retry-After. 5 per session covers a member with several tabs;
    # 10 per member allows a second device; 500 per instance is far above what a self-hosted
    # instance with a few households needs, while still bounding memory and connections.
    max-streams-per-session: 5
    max-streams-per-member: 10
    max-streams: 500
    # Sent as Retry-After with a rejected stream. Long enough that a client does not hammer the
    # server while its other tabs are still open.
    retry-after: 30s

  notifications:
    templates:
      # Empty by default: no override directory active, only the bundled email templates/messages
      # (see EmailTemplatingConfig) are used. Self-hosters can point this at a directory containing
      # their own "messages/email_<locale>.properties" and/or "templates/email/*.html" files to
      # override individual translations or the whole HTML layout without rebuilding the image, e.g.
      # LIBREHOUSEHOLD_NOTIFICATIONS_TEMPLATES_OVERRIDE_DIR=/config/templates. Overridden keys/files
      # take precedence; anything not overridden falls back to the bundled default.
      override-dir: ""
