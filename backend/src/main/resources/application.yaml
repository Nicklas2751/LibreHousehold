spring:
  application:
    name: librehousehold
  modulith:
    runtime:
      flyway-enabled: true
  web:
    error:
      # Defense-in-depth against leaking stacktraces to clients (OWASP A05): this already matches
      # Spring Boot's own default, but is set explicitly so it can never regress via an environment-
      # or tooling-specific default. Note the prefix: in Boot 4 this is bound via WebProperties
      # ("spring.web.error.*", see ErrorMvcAutoConfiguration), NOT the legacy "server.error.*" this
      # was previously (incorrectly) set under — that key is silently ignored by Boot 4 and never
      # bound to anything, which is exactly why this setting failed to prevent a real leak:
      # spring-boot-devtools ships its own "spring.web.error.include-stacktrace=always" default
      # (see spring-devtools.properties) as the lowest-priority PropertySource, and with no
      # higher-priority source ever actually setting the *correct* key, that devtools default won
      # in local dev (see the ValidationExceptionHandler / ErrorResponseExceptionHandler class
      # comments for the actual fix: those two custom exception families never even reach this
      # fallback page anymore).
      include-stacktrace: never

server:
  # Nginx terminates TLS and forwards internally over plain HTTP (see Kapitel 7). Without this,
  # Spring ignores X-Forwarded-Proto and treats every request as insecure, so CookieCsrfTokenRepository
  # would omit the Secure flag on XSRF-TOKEN (the session cookie is unaffected, its Secure flag is set
  # statically below). "framework" uses Spring's own ForwardedHeaderFilter instead of a Tomcat-specific
  # mechanism (e.g. RemoteIpValve's "native" strategy) and needs no trusted-proxy IP allowlist: the
  # backend is only reachable from Nginx on the internal Docker network, never directly from clients.
  forward-headers-strategy: framework
  tomcat:
    max-http-post-size: -1
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        # Lax, not Strict (see DD-7/ADR-014): the login flow relies on a cross-site GET navigation
        # (e.g. the SPA navigating to /oauth2/authorization/spa-backend-client), which Strict would
        # not send the cookie for.
        same-site: lax

librehousehold:
  security:
    oauth2-authorization-server:
      issuer: http://localhost:8080
    oauth2-client:
      redirect-uri: http://localhost:8080/login/oauth2/code/spa-backend-client
      # No default on purpose (fail-fast): a confidential OAuth2 client secret must never ship with
      # a committed, publicly-known default value. Self-hosters must set this explicitly, e.g. via
      # LIBREHOUSEHOLD_SECURITY_OAUTH2_CLIENT_CLIENT_SECRET or an untracked application.yaml.
    cors:
      # Comma-separated allow-list of origins permitted to send credentialed cross-origin requests
      # (see CORS1 in Arc42 Chapter 8). Empty by default (locked down): the target deployment serves
      # frontend and backend from the same origin via an Nginx reverse proxy. Self-hosters serving
      # them from different origins must set this explicitly, e.g.
      # LIBREHOUSEHOLD_SECURITY_CORS_ALLOWED_ORIGINS=https://household.example.com.
      allowed-origins: ""
