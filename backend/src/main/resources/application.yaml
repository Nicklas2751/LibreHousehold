spring:
  application:
    name: librehousehold
  modulith:
    runtime:
      flyway-enabled: true
  mail:
    # Empty by default (same rationale as security.cors.allowed-origins below), not omitted: Spring
    # Boot's mail autoconfiguration only creates the JavaMailSender bean at all when this property is
    # present, and EmailSenderService (see the notifications module) depends on that bean unconditionally.
    # Self-hosters must set this (and port/username/password) explicitly, e.g. via SPRING_MAIL_HOST/
    # SPRING_MAIL_PORT/SPRING_MAIL_USERNAME/SPRING_MAIL_PASSWORD or an untracked application.yaml —
    # until then, sending an actual email fails at send time rather than at startup.
    host: ""
  web:
    error:
      # Defense-in-depth against leaking stacktraces to clients (OWASP A05): this already matches
      # Spring Boot's own default, but is set explicitly so it can never regress via an environment-
      # or tooling-specific default. Note the prefix: in Boot 4 this is bound via WebProperties
      # ("spring.web.error.*", see ErrorMvcAutoConfiguration), NOT the legacy "server.error.*" this
      # was previously (incorrectly) set under — that key is silently ignored by Boot 4 and never
      # bound to anything, which is exactly why this setting failed to prevent a real leak:
      # spring-boot-devtools ships its own "spring.web.error.include-stacktrace=always" default
      # (see spring-devtools.properties) as the lowest-priority PropertySource, and with no
      # higher-priority source ever actually setting the *correct* key, that devtools default won
      # in local dev (see the ValidationExceptionHandler / ErrorResponseExceptionHandler class
      # comments for the actual fix: those two custom exception families never even reach this
      # fallback page anymore).
      include-stacktrace: never

server:
  # Nginx terminates TLS and forwards internally over plain HTTP (see Kapitel 7). Without this,
  # Spring ignores X-Forwarded-Proto and treats every request as insecure, so CookieCsrfTokenRepository
  # would omit the Secure flag on XSRF-TOKEN (the session cookie is unaffected, its Secure flag is set
  # statically below). "framework" uses Spring's own ForwardedHeaderFilter instead of a Tomcat-specific
  # mechanism (e.g. RemoteIpValve's "native" strategy) and needs no trusted-proxy IP allowlist: the
  # backend is only reachable from Nginx on the internal Docker network, never directly from clients.
  forward-headers-strategy: framework
  tomcat:
    max-http-post-size: -1
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        # Lax, not Strict (see DD-7/ADR-014): the login flow relies on a cross-site GET navigation
        # (e.g. the SPA navigating to /oauth2/authorization/spa-backend-client), which Strict would
        # not send the cookie for.
        same-site: lax

librehousehold:
  security:
    oauth2-authorization-server:
      issuer: http://localhost:8080
    oauth2-client:
      redirect-uri: http://localhost:8080/login/oauth2/code/spa-backend-client
      # No default on purpose (fail-fast): a confidential OAuth2 client secret must never ship with
      # a committed, publicly-known default value. Self-hosters must set this explicitly, e.g. via
      # LIBREHOUSEHOLD_SECURITY_OAUTH2_CLIENT_CLIENT_SECRET or an untracked application.yaml.
    cors:
      # Comma-separated allow-list of origins permitted to send credentialed cross-origin requests
      # (see CORS1 in Arc42 Chapter 8). Empty by default (locked down): the target deployment serves
      # frontend and backend from the same origin via an Nginx reverse proxy. Self-hosters serving
      # them from different origins must set this explicitly, e.g.
      # LIBREHOUSEHOLD_SECURITY_CORS_ALLOWED_ORIGINS=https://household.example.com.
      allowed-origins: ""
    email-verification:
      # How long a freshly issued email verification token stays valid (see VERIFY1 in Arc42
      # Chapter 8, and the account_token migration). 24h balances giving users enough time to check
      # their inbox against not leaving a long-lived, single-use credential around; a resend
      # (see /verification/resend) issues a fresh token with a new deadline at any time.
      token-validity: 24h
      # Grace period after registration before an account that never verified its email is deleted
      # (see UnverifiedAccountExpiryJob). A full week gives users generous time to find/confirm the
      # verification email even across a busy week, while still bounding how long unverified,
      # unusable accounts accumulate.
      grace-period-days: 7
      # How long before grace-period-days expiry the deletion warning email is sent, so the user has
      # a final chance to verify before the account/household is actually deleted.
      deletion-warning-hours-before: 24
    password-reset:
      # How long a freshly issued password reset token stays valid (see RESET1 in Arc42 Chapter 8).
      # Shorter than email-verification's 24h on purpose: a password reset link is a more sensitive,
      # higher-privilege credential than an email verification link, so it should not remain usable
      # for long. Requesting a new one at any time issues a fresh token with a new deadline.
      token-validity: 1h
    rate-limit:
      # RATE1 (see Arc42 Chapter 8): throttles POST /login per username+IP combination, on top of
      # the account-wide lockout below. 5 attempts per minute is generous enough for a genuine user
      # who mistypes their password a couple of times, while still meaningfully slowing down
      # credential-stuffing/brute-force attempts against a single account.
      login:
        max-attempts: 5
        window-duration: 1m
      # Shared by the password-reset and email-verification endpoints (POST /password-reset/request,
      # /password-reset/confirm, /members/verification/confirm, and the per-member
      # /verification/resend), keyed by IP only: several of these endpoints are unauthenticated and
      # have no meaningful "username" to key on, and an attacker trying many different email
      # addresses must still be throttled.
      sensitive-endpoints:
        max-attempts: 5
        window-duration: 1m
    lockout:
      # Account-wide lockout after repeated failed login attempts (AuthenticationFailureBadCredentialsEvent,
      # see AccountLockoutListener), independent of how slowly the attempts were made - complements
      # the rate-limit above, which only throttles the *rate*. Higher than rate-limit.login.max-attempts
      # on purpose: a legitimate user who is simply slow (e.g. across several rate-limit windows)
      # should not get their account locked as easily as they get rate-limited.
      max-attempts: 10
      lockout-duration: 15m

  frontend:
    # Base URL used to build links that are sent in emails (e.g. the email verification link) and
    # therefore must be absolute, since they are followed outside of any authenticated browser
    # session. Defaults to the same-origin deployment target described in the CORS comment above;
    # self-hosters serving the frontend from a different origin must override this, e.g.
    # LIBREHOUSEHOLD_FRONTEND_BASE_URL=https://household.example.com.
    base-url: "http://localhost:8080"
