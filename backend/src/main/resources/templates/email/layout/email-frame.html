<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<table th:fragment="frame(content)" role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background-color:#f3f4f6;padding:24px 0;font-family:Arial,Helvetica,sans-serif;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;">
                <tr>
                    <td style="padding:24px;text-align:center;">
                        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                            <tr>
                                <td style="background-color:#570df8;border-radius:8px;width:48px;height:48px;text-align:center;vertical-align:middle;">
                                    <span style="color:#ffffff;font-weight:bold;font-size:20px;">LH</span>
                                </td>
                            </tr>
                        </table>
                        <h1 style="margin:16px 0 0;font-size:20px;color:#1f2937;">LibreHousehold</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 24px 24px;color:#1f2937;font-size:14px;line-height:1.5;">
                        <div th:replace="${content}">Content goes here.</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 24px;background-color:#f9fafb;text-align:center;font-size:12px;color:#6b7280;border-radius:0 0 8px 8px;">
                        This email was sent by LibreHousehold.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
