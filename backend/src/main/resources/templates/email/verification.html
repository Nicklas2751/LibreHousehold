<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout/email-frame :: frame(~{::.email-body})}">
    <div class="email-body">
        <h2 style="margin:0 0 12px;font-size:16px;" th:text="#{verification.subject}">Verify your email address</h2>
        <p style="margin:0 0 16px;" th:text="#{verification.body(${verificationLink})}">Body text placeholder</p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
            <tr>
                <td style="background-color:#570df8;border-radius:6px;">
                    <a th:href="${verificationLink}" th:text="${verificationLink}"
                       style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-weight:bold;font-size:14px;">https://example.com/verify-email/token</a>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
